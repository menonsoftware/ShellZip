[package]
name = "shellzip-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ShellZip desktop archive manager"

[[bin]]
name = "shellzip"
path = "src/main.rs"

[dependencies]
directories = "6.0.0"
eframe = "0.32"
egui = "0.32"
egui_extras = { version = "0.32", features = ["all_loaders"] }
image = { workspace = true }
rfd = "0.15"
shellzip-core = { path = "../shellzip-core", features = ["rar", "sevenz-codecs", "sevenz-parallel"] }
shellzip-integrate = { path = "../shellzip-integrate" }
sysinfo = { version = "0.40.1", default-features = false, features = ["disk"] }
toml = "1.1.8"
trash = { version = "5.3.0", default-features = false, features = ["coinit_apartmentthreaded", "freedesktop"] }
velopack = "1.2.161"

# Workspace forbids unsafe; package identity needs one Win32 call.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target."cfg(windows)".dependencies]
file_icon_provider = "1.0.2"
systemicons = "0.9.13"
windows = { version = "0.61", features = ["Win32_Storage_Packaging_Appx"] }
windows-icons = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
file_icon_provider = "1.0.2"
systemicons = "0.9.13"

[target.'cfg(target_os="linux")'.dependencies]
freedesktop-icons = "0.4.0"
resvg = "0.49.0"
xdg-mime = "0.4.0"

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[package.metadata.bundle]
name = "ShellZip"
identifier = "com.shellzip.ShellZip"
icon = ["assets/shellzip.icns"]

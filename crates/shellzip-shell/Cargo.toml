[package]
name = "shellzip-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Explorer context menu and icon handler for ShellZip"

[lib]
crate-type = ["cdylib", "rlib"]
name = "shellzip_shell"
path = "src/lib.rs"

[dependencies]
shellzip-integrate = { path = "../shellzip-integrate" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"

# COM FFI. The workspace forbids unsafe, so this binary opts out
# and denies it everywhere except the COM glue.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

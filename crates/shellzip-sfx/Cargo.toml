[package]
name = "shellzip-sfx"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Self-extracting ZIP stub for ShellZip"

[[bin]]
name = "shellzip-sfx"
path = "src/main.rs"

[dependencies]
shellzip-core = { path = "../shellzip-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

# MessageBoxW is FFI. The workspace forbids unsafe, so this binary opts out
# and denies it everywhere except the two Win32 calls.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[build-dependencies]
winresource = "0.1.34"

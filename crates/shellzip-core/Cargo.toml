[package]
name = "shellzip-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Archive pack and unpack core for ShellZip"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crc32fast = "1"
filetime = "0.2"
# `zlib-rs` matches zesven's deflate backend. Enabling both `miniz_oxide` and
# `zlib-rs` on one `flate2` build does not compile.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
globset = "0.4"
tar = "0.4"
thiserror = "2"
tracing = "0.1"
walkdir = "2"
# Prefer `deflate-flate2-zlib-rs` (not the umbrella `deflate`, which also pulls Zopfli).
# Zip 8 stamps host OS from the build target (DOS on Windows, Unix elsewhere).
zip = { version = "8", default-features = false, features = [
    "deflate-flate2-zlib-rs",
    "zstd",
    "time",
    "aes-crypto",
] }
zstd = { version = "0.13", features = ["zstdmt"] }
zeroize = "1"
rayon = "1.12.0"
blake2s_simd = "1.0.5"
xz2 = { version = "0.1.7", default-features = false, features = ["static"] }
bzip2 = "0.6.1"
unrar = { version = "0.5.8", optional = true }
zesven = { version = "3.2", default-features = false, features = ["lzma2", "aes"], optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = { version = "1.12.0", default-features = false, features = ["std", "regex-syntax"] }
sha2 = "0.10"
tempfile = "3"
zesven = { version = "3.2", default-features = false, features = ["lzma2", "aes"] }

[[bench]]
name = "zip_threads"
harness = false

[[test]]
name = "sevenz"
required-features = ["sevenz"]

[lints]
workspace = true

[features]
# Extraction only. The UnRAR licence forbids a RAR compressor.
rar = ["dep:unrar"]
# 7z read and write: LZMA, LZMA2, and AES-256. This is what the SFX stub links.
sevenz = ["dep:zesven"]
# Extra 7z codecs. Additive: a `sevenz`-only build still reads LZMA2 and AES.
sevenz-codecs = ["sevenz", "zesven/deflate", "zesven/bzip2", "zesven/ppmd", "zesven/zstd"]
# Multi-threaded 7z compression and a memory budget taken from the machine.
sevenz-parallel = ["sevenz", "zesven/parallel", "zesven/sysinfo"]

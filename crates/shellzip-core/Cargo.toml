[package]
name = "shellzip-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Archive pack and unpack core for ShellZip"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crc32fast = "1"
filetime = "0.2"
flate2 = "1"
globset = "0.4"
tar = "0.4"
thiserror = "2"
tracing = "0.1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate", "zstd", "time"] }
zstd = "0.13"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

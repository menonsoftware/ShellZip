[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Developer tasks for ShellZip"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
ico = "0.4"
image = { workspace = true, default-features = false, features = ["png"] }
resvg = { version = "0.49", default-features = false, features = ["raster-images", "system-fonts", "text"] }
sha2 = { version = "0.11.1", default-features = false }
shellzip-core = { path = "../crates/shellzip-core", features = ["sevenz-codecs", "sevenz-parallel"] }
tiny-skia = "0.12"
usvg = { version = "0.49", default-features = false, features = ["system-fonts", "text"] }

[lints]
workspace = true

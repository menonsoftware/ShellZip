[workspace]
resolver = "2"
members = [
    "crates/shellzip-core",
    "crates/shellzip-cli",
    "crates/shellzip-gui",
]
default-members = [
    "crates/shellzip-core",
    "crates/shellzip-cli",
    "crates/shellzip-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace]
resolver = "2"
members = [
    "crates/shellzip-core",
    "crates/shellzip-cli",
    "crates/shellzip-gui",
    "crates/shellzip-sfx",
    "xtask",
]
default-members = [
    "crates/shellzip-core",
    "crates/shellzip-cli",
    "crates/shellzip-gui",
    "crates/shellzip-sfx",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Size-sensitive binaries. `cargo build -p shellzip-sfx --profile minisize`
[profile.minisize]
inherits = "release"
opt-level = "z"
panic = "abort"

# License, advisory, and source checks for `cargo deny check`.
# Allowed licenses are MIT, Apache-2.0, and BSD-compatible.
# The vendored UnRAR sources are extraction-only; see the unrar_sys clarify below.

[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
# Transitive GUI crates (eframe, accesskit, rfd) are unmaintained with no upgrade.
# Workspace members are still rejected if they become unmaintained.
unmaintained = "workspace"
ignore = [
    # zip 2.6.1's ZipArchive::extract / ZipStreamReader::extract. ShellZip never
    # calls those methods; entry names go through safe_path. The fix is zip >= 9.
    { id = "RUSTSEC-2026-0367", reason = "ShellZip does not call ZipArchive::extract or ZipStreamReader::extract" },
    { id = "RUSTSEC-2026-0368", reason = "ShellZip does not call ZipArchive::extract or ZipStreamReader::extract" },
    { id = "RUSTSEC-2026-0369", reason = "ShellZip does not call ZipArchive::extract or ZipStreamReader::extract" },
    # zip 2.6.1 and zesven 3.2.0 require zstd 0.13. The fix is zstd >= 0.14.3.
    # Each member gets a new encoder or decoder; contexts are not reused.
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 is required by zip 2.6.1 and zesven 3.2.0; encoders are not reused across members" },
    { id = "RUSTSEC-2026-0398", reason = "Seekable::decompress is unused; zstd 0.13 is required by zip 2.6.1 and zesven 3.2.0" },
    { id = "RUSTSEC-2026-0403", reason = "zstd 0.13 is required by zip 2.6.1 and zesven 3.2.0; the fix is zstd-safe >= 8.2.0" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "Unicode-3.0",
    # bzip2 1.0.6, used by libbz2-rs-sys. BSD-like, as noted in the MVP plan.
    "bzip2-1.0.6",
    # CC0-like terms for the Mozilla CA list in webpki-roots.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # egui's bundled font crate. OFL and the Ubuntu Font Licence stay on this crate.
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
    # File-level MPL-2.0 via dirs-sys. Not accepted for any other crate.
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # Extraction only. The UnRAR licence forbids a RAR compressor.
    { allow = ["LicenseRef-UnRAR"], crate = "unrar_sys" },
]

[[licenses.clarify]]
crate = "unrar_sys"
expression = "(MIT OR Apache-2.0) AND LicenseRef-UnRAR"
license-files = [{ path = "vendor/unrar/license.txt", hash = 0x46456911 }]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

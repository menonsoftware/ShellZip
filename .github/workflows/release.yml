name: release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Release tag name (for example v0.1.2)
        required: true
        type: string
      sha:
        description: Commit to build when the tag ref is not available yet
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  # Build every platform first. Nothing is uploaded to GitHub Releases or the
  # Store from this job — a failed matrix leg must not leave a partial release.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            channel: win
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            channel: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            channel: osx
    runs-on: ${{ matrix.os }}
    # Optional GPG secrets sign the Linux Velopack feed. Windows Velopack packs
    # stay unsigned; Partner Center re-signs the Store MSIX after upload.
    steps:
      - uses: actions/checkout@v4
        with:
          # Prefer an explicit SHA from auto-release so packaging can proceed
          # even when creating the tag ref is delayed or blocked.
          ref: ${{ inputs.sha || inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libgtk-3-dev libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libssl-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev gnupg
      - name: Build CLI and GUI
        run: cargo build --release --locked --target ${{ matrix.target }} -p shellzip-cli -p shellzip-gui
      - name: Build SFX stub
        run: cargo build --profile minisize --locked --target ${{ matrix.target }} -p shellzip-sfx
      - name: Build Windows shell extension
        if: runner.os == 'Windows'
        run: cargo build --release --locked --target ${{ matrix.target }} -p shellzip-shell
      - name: Portable archive
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          target=${{ matrix.target }}
          ext=${{ matrix.ext }}
          name=ShellZip-${RELEASE_TAG}-${target}
          sfx_src=target/${target}/minisize/shellzip-sfx${ext}
          sfx_asset=shellzip-sfx-${target}${ext}
          test -f "target/${target}/release/szip${ext}"
          test -f "target/${target}/release/shellzip${ext}"
          test -f "$sfx_src"
          mkdir "$name"
          cp "target/${target}/release/szip${ext}" "$name/"
          cp "target/${target}/release/shellzip${ext}" "$name/"
          cp "$sfx_src" "$name/shellzip-sfx${ext}"
          cp README.md "$name/"
          if [ "$RUNNER_OS" = "Windows" ] && [ -f "target/${target}/release/shellzip_shell.dll" ]; then
            cp "target/${target}/release/shellzip_shell.dll" "$name/"
          fi
          cp "$sfx_src" "$sfx_asset"
          mkdir -p dist/portable
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "dist/portable/$name.zip" "$name"
            7z l "dist/portable/$name.zip" | tee package-listing.txt
          else
            tar czf "dist/portable/$name.tar.gz" "$name"
            tar tzf "dist/portable/$name.tar.gz" | tee package-listing.txt
          fi
          cp "$sfx_asset" "dist/portable/"
          grep -F "shellzip-sfx${ext}" package-listing.txt
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install vpk
        run: dotnet tool update -g vpk
      - name: Stage Velopack packDir
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: cargo run -p xtask -- velopack-stage ${{ matrix.channel }}
      - name: Download previous Velopack release
        shell: bash
        env:
          VPK_OUTPUT_DIR: dist/velopack/Releases-${{ matrix.channel }}
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p "$VPK_OUTPUT_DIR"
          vpk download github \
            --repoUrl "https://github.com/${{ github.repository }}" \
            --channel "${{ matrix.channel }}" \
            --outputDir "$VPK_OUTPUT_DIR" \
            || echo "No previous ${{ matrix.channel }} feed (first release or empty channel)"
      - name: Pack Velopack
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          VPK_OUTPUT_DIR: dist/velopack/Releases-${{ matrix.channel }}
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools:$HOME/.cargo/bin"
          VERSION="${RELEASE_TAG#v}"
          export VELOPACK_VERSION="$VERSION"
          if [ "${{ runner.os }}" = "Linux" ] && [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            GNUPGHOME="$(mktemp -d)"
            export GNUPGHOME
            chmod 700 "$GNUPGHOME"
            printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fi
          cargo run -p xtask -- velopack-pack ${{ matrix.channel }}
      - name: Pack Debian package
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          export VELOPACK_VERSION="$VERSION"
          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            GNUPGHOME="$(mktemp -d)"
            export GNUPGHOME
            chmod 700 "$GNUPGHOME"
            printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fi
          cargo run -p xtask -- deb-pack
          shopt -s nullglob
          deb=(dist/deb/shellzip_*.deb)
          test -f "${deb[0]}"
          dpkg-deb --info "${deb[0]}"
          dpkg-deb --contents "${deb[0]}" | grep -F "./usr/bin/shellzip"
          dpkg-deb --contents "${deb[0]}" | grep -F "./usr/bin/szip"
          dpkg-deb --contents "${deb[0]}" | grep -F "./usr/share/applications/shellzip.desktop"
      - name: Pack Store MSIX
        if: runner.os == 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          STORE_IDENTITY_NAME: ${{ secrets.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          export VELOPACK_VERSION="$VERSION"
          cargo run -p xtask -- msix-pack
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.channel }}
          path: dist/portable/
          if-no-files-found: error
      - name: Upload Velopack artifact
        uses: actions/upload-artifact@v4
        with:
          name: velopack-${{ matrix.channel }}
          path: dist/velopack/Releases-${{ matrix.channel }}/
          if-no-files-found: error
      - name: Upload Debian artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/deb/
          if-no-files-found: error
      - name: Upload Store MSIX artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: msix
          path: dist/msix/ShellZip-*-x64.msix
          if-no-files-found: error

  # Runs only when every matrix leg of `build` succeeded. Publishes GitHub
  # Release assets (including the unsigned Store MSIX) and Velopack feeds in one
  # place so a failed OS cannot ship. Partner Center submission is store.yml.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || inputs.tag || github.ref }}
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install vpk
        run: dotnet tool update -g vpk
      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp artifacts/portable-win/* dist/release/
          cp artifacts/portable-linux/* dist/release/
          cp artifacts/portable-osx/* dist/release/
          if [ -d artifacts/deb ]; then
            cp artifacts/deb/*.deb dist/release/
            shopt -s nullglob
            for asc in artifacts/deb/*.asc; do
              cp "$asc" dist/release/
            done
          fi
          if [ -d artifacts/msix ]; then
            cp artifacts/msix/*.msix dist/release/
          fi
          mkdir -p dist/velopack
          for channel in win linux osx; do
            src="artifacts/velopack-${channel}"
            test -d "$src"
            mkdir -p "dist/velopack/Releases-${channel}"
            cp -a "$src"/. "dist/velopack/Releases-${channel}/"
          done
          if [ -f dist/velopack/Releases-linux/SHA256SUMS ]; then
            cp dist/velopack/Releases-linux/SHA256SUMS dist/release/
          fi
          shopt -s nullglob
          for asc in dist/velopack/Releases-linux/*.asc; do
            cp "$asc" dist/release/
          done
          ls -la dist/release
      - name: Create GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Upload Velopack feeds
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          VERSION="${RELEASE_TAG#v}"
          for channel in win linux osx; do
            vpk upload github \
              --repoUrl "https://github.com/${{ github.repository }}" \
              --token "$GITHUB_TOKEN" \
              --channel "$channel" \
              --outputDir "dist/velopack/Releases-${channel}" \
              --tag "$RELEASE_TAG" \
              --releaseName "ShellZip $VERSION" \
              --publish \
              --merge
          done

name: auto-release

on:
  push:
    branches: [master]

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release ') }}"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Bump patch version, commit, and tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          read_version() {
            python - "$1" <<'PY'
          import re
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          match = re.search(r'(?m)^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text)
          if not match:
              raise SystemExit(f"workspace.package version not found in {sys.argv[1]}")
          print(".".join(match.groups()))
          PY
          }

          next_version() {
            python - "$1" <<'PY'
          import re
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          match = re.search(r'(?m)^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text)
          if not match:
              raise SystemExit(f"workspace.package version not found in {sys.argv[1]}")
          major, minor, patch = map(int, match.groups())
          print(f"{major}.{minor}.{patch + 1}")
          PY
          }

          write_version() {
            NEW_VERSION="$1" python - <<'PY'
          import os
          import re
          from pathlib import Path
          version = os.environ["NEW_VERSION"]
          path = Path("Cargo.toml")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^(version\s*=\s*")\d+\.\d+\.\d+(")',
              rf"\g<1>{version}\2",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("failed to rewrite workspace.package version")
          path.write_text(updated, encoding="utf-8")
          PY
          }

          refresh_lockfile() {
            # Refresh only workspace package versions in the lockfile (do not
            # regenerate / mass-upgrade transitive crates).
            cargo update \
              -p shellzip-cli \
              -p shellzip-core \
              -p shellzip-gui \
              -p shellzip-sfx \
              -p shellzip-integrate \
              -p shellzip-shell \
              -p xtask
          }

          publish_tag() {
            local tag="$1"
            local sha="$2"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists on origin."
              return 0
            fi
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              git tag -a "${tag}" -m "ShellZip ${tag}" "${sha}"
            fi
            # Prefer an explicit refs/tags push; fall back to the GitHub API when
            # a ruleset blocks the default GITHUB_TOKEN from creating tags.
            if git push origin "refs/tags/${tag}"; then
              return 0
            fi
            echo "git push of ${tag} failed; creating the tag ref via the API" >&2
            python - "${tag}" "${sha}" <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          tag, sha = sys.argv[1], sys.argv[2]
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          body = json.dumps({"ref": f"refs/tags/{tag}", "sha": sha}).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/git/refs",
              data=body,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "shellzip-auto-release",
              },
          )
          try:
              with urllib.request.urlopen(request) as response:
                  response.read()
          except urllib.error.HTTPError as err:
              detail = err.read().decode("utf-8", errors="replace")
              raise SystemExit(f"create tag ref API failed: {err.code} {detail}") from err
          PY
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master --tags --force

          version="$(next_version Cargo.toml)"
          tag="v${version}"

          # Idempotent recovery: a previous bump may have pushed the release
          # commit but failed before the tag landed (or a re-run checked out the
          # pre-bump SHA). Prefer finishing the missing tag over bumping again.
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists on origin; continuing release."
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse "refs/tags/${tag}^{commit}" 2>/dev/null || git rev-parse "origin/master")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          remote_toml="$(mktemp)"
          git show origin/master:Cargo.toml > "${remote_toml}"
          remote_version="$(read_version "${remote_toml}")"
          rm -f "${remote_toml}"

          if [[ "${remote_version}" == "${version}" ]]; then
            echo "origin/master is already ${version}; creating missing tag ${tag}."
            sha="$(git rev-parse origin/master)"
            publish_tag "${tag}" "${sha}"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "sha=${sha}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          write_version "${version}"
          refresh_lockfile
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release ${tag}"
          sha="$(git rev-parse HEAD)"
          # Push the release commit first so a tag-only failure can be retried
          # without rewriting history.
          git push origin HEAD:master
          publish_tag "${tag}" "${sha}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: bump
    if: ${{ needs.bump.outputs.tag != '' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}
      sha: ${{ needs.bump.outputs.sha }}
    secrets: inherit
